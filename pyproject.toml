[project]
name = "mlb-jpply-analysis"
version = "0.1.0"
description = "MLB 日本選手応募・分析プロジェクト"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars",
    "pyarrow",
    "matplotlib",
    "seaborn",
    "papermill",
    "ipykernel",
    "python-dotenv",
    "pydantic",
    "scikit-learn>=1.8.0",
    "japanize-matplotlib",
    "pybaseball>=2.2.7",
    "scipy>=1.17.1",
    "pandas>=3.0.3",
    "requests>=2.34.2",
    "mlb-statsapi>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_project"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
